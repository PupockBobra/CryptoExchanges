services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: arbi
      POSTGRES_PASSWORD: arbi
      POSTGRES_DB: arbidb
    # Raise max_locks_per_transaction — TimescaleDB hypertable queries take
    # one lock per chunk and the default (64) is exhausted once the OHLCV
    # hypertable accumulates a few hundred chunks (esp. empty future ones).
    command:
      - postgres
      - -c
      - max_locks_per_transaction=512
      - -c
      - shared_buffers=256MB
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./backend/app/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbi -d arbidb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql://arbi:arbi@timescaledb:5432/arbidb
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  collector:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql://arbi:arbi@timescaledb:5432/arbidb
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m worker.main

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000

volumes:
  timescale_data:
  redis_data:
