map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    # Re-resolve upstream container IPs every 10 s via Docker's embedded DNS.
    # Without this, nginx caches the IP at startup and returns 502 after any
    # `docker compose up -d backend|frontend` (the recreated container gets a
    # new IP but nginx keeps hitting the dead old one).
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $backend_upstream  "backend:8000";
    set $frontend_upstream "frontend:80";

    location /api/ {
        proxy_pass       http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass         http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    location /health { proxy_pass http://$backend_upstream; }
    location /docs   { proxy_pass http://$backend_upstream; }

    location / {
        proxy_pass http://$frontend_upstream;
    }
}
