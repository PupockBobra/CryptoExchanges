map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    # The spread-history endpoints return ~1–2 MB of JSON per call (15-min points
    # × 7 days × ~100 instruments) and every open Order Book / MM tab re-fetches
    # them on a timer.  This JSON compresses ~10×.
    #
    # JS/CSS matter just as much: the bundle carries Plotly and is ~5 MB, and
    # without it in gzip_types every first visit downloaded all 5 MB raw.
    # gzip_vary tells shared caches the response varies on Accept-Encoding.
    gzip             on;
    gzip_proxied     any;
    gzip_vary        on;
    gzip_comp_level  5;
    gzip_types       application/json
                     application/javascript text/javascript
                     text/css text/plain image/svg+xml;
    gzip_min_length  1024;

    # Re-resolve upstream container IPs every 10 s via Docker's embedded DNS.
    # Without this, nginx caches the IP at startup and returns 502 after any
    # `docker compose up -d backend|frontend` (the recreated container gets a
    # new IP but nginx keeps hitting the dead old one).
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $backend_upstream  "backend:8000";
    set $frontend_upstream "frontend:80";

    location /api/ {
        proxy_pass       http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass         http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    location /health { proxy_pass http://$backend_upstream; }
    location /docs   { proxy_pass http://$backend_upstream; }

    # Crypto index replicator — a standalone systemd service on the HOST
    # (/opt/crypto-index, uvicorn :8787), not part of this compose stack.
    # nginx runs in a container, so 127.0.0.1 would be the container itself —
    # the host is reached via the app_default bridge gateway.  Port 8787 is
    # closed to the internet by ufw (allowed only from 172.16.0.0/12).
    # The trailing slash in proxy_pass strips the /crypto-index prefix.
    location = /crypto-index { return 301 /crypto-index/; }
    location /crypto-index/ {
        proxy_pass       http://172.18.0.1:8787/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://$frontend_upstream;
    }
}
