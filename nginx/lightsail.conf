# AWS Lightsail production config
# Prerequisites:
#   1. Replace YOUR_DOMAIN with your actual domain
#   2. Obtain TLS cert: certbot --nginx -d YOUR_DOMAIN
#   3. docker compose -f docker-compose.prod.yml up -d

upstream backend  { server backend:8000; }
upstream frontend { server frontend:80; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limit zone — 30 req/min per IP across the API surface.
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=30r/m;

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Mozilla "intermediate" — TLS 1.2/1.3 with modern ciphers only.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-Content-Type-Options    nosniff always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;

    client_max_body_size 10m;

    # Gzip — frontend ships ~3.5 MB of Plotly minified, big win on the wire.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    location /api/ {
        limit_req zone=api_rl burst=20 nodelay;
        proxy_pass       http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Backfill/launches refresh take up to a minute on cold start.
        proxy_read_timeout 90s;
    }

    location /ws/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    location /health { proxy_pass http://backend; }
    location /docs   { proxy_pass http://backend; }

    location / {
        proxy_pass http://frontend;
    }
}
