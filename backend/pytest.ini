[pytest]
testpaths = tests
# Tests import `app.*`, which only resolves if backend/ is on sys.path.  Without
# this, the suite collects ONLY via `python -m pytest` run from backend/ (that
# form implicitly adds the CWD); bare `pytest` and runs from the repo root fail
# with ModuleNotFoundError.  `.` is resolved relative to rootdir (= this file).
pythonpath = .
